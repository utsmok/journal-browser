# Two-institution test stack on free ports (db 5553, backend 8100,
# frontend 3100). Same images and env as the live stack; run with:
#   docker compose -p jb-multi -f docker-compose.yml -f compose.multi.yml up -d --build
services:
  db:
    ports: !override
      - "127.0.0.1:5553:5432"
  backend:
    ports: !override
      - "127.0.0.1:8100:8000"
  frontend:
    ports: !override
      - "127.0.0.1:3100:3000"
