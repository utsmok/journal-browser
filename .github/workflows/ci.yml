name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: journal
          POSTGRES_DB: journalbrowser_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U journal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JB_DATABASE_URL: postgresql+asyncpg://journal:journal@localhost:5433/journalbrowser_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check src tests jobs
      - run: uv run ruff format --check src tests jobs
      - run: uv run alembic upgrade head
      - run: uv run pytest -m "not live"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
