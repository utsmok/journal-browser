# QA workflow (generated by /install-qa).
#
# Advisory check: it runs on every PR and goes red when QA fails, but does
# not block merges. To make it blocking, add "qa" to branch protection
# required status checks for main (Settings > Branches).
#
# The QA agent boots its own backend and frontend dev server on the ports
# configured in .factory/skills/qa/config.yaml (environments.local-qa);
# this workflow only provisions dependencies and the seeded
# journalbrowser_qa database.
name: qa

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: qa-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: journal
          POSTGRES_DB: journalbrowser_qa
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U journal -d journalbrowser_qa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CI: 'true'
      JB_DATABASE_URL: postgresql+asyncpg://journal:journal@127.0.0.1:5433/journalbrowser_qa
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Install backend deps
        working-directory: backend
        run: uv sync

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Migrate and seed the QA database
        working-directory: backend
        run: |
          uv run --no-dev alembic upgrade head
          uv run python scripts/seed_fixtures.py
          psql postgresql://journal:journal@127.0.0.1:5433/journalbrowser_qa \
            -c 'select count(*) as journals from journals'

      - name: Install droid CLI
        run: |
          curl -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run QA
        timeout-minutes: 20
        # Failure is captured in QA_FAILED and re-raised by the gate step
        # below, so the report and artifacts are always produced first and
        # the required check still blocks the merge on failure.
        run: |
          set -o pipefail
          droid exec --auto high "You are running in a non-interactive CI environment. There is NO human available. Do NOT use AskUser, do NOT wait for confirmations, do NOT pause for input. Run the qa skill. The QA database journalbrowser_qa is already migrated and seeded, and QA_ADMIN_PASSWORD is set. The diff base is the merge base with origin/${{ github.base_ref }}. Boot the QA backend and frontend per the qa skill pre-flight, run the diff-relevant flows, and write the final report to qa-results/report.md" 2>&1 | tee qa-output.txt \
            || echo "QA_FAILED=1" >> "$GITHUB_ENV"

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results-${{ github.event.pull_request.number || github.run_id }}
          path: |
            qa-results/
            qa-output.txt
          retention-days: 14

      - name: Post QA report as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request context (workflow_dispatch); skipping comment."
            exit 0
          fi
          {
            echo '<!-- qa-report -->'
            if [ -f qa-results/report.md ]; then
              cat qa-results/report.md
            else
              echo '## QA Report'
              echo
              echo ':no_entry: QA run produced no report. Check the job log and the qa-results artifact.'
            fi
            echo
            echo "---"
            echo
            echo "[Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) - full evidence in the qa-results artifact"
          } > qa-comment.md
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | startswith("<!-- qa-report -->")) | .id' | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH \
              "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" \
              -f body=@qa-comment.md
          else
            gh api --method POST \
              "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
              -f body=@qa-comment.md
          fi

      - name: Fail the check when QA failed
        if: always() && env.QA_FAILED == '1'
        run: |
          echo "The QA run failed; see the PR report comment and the qa-results artifact."
          exit 1
