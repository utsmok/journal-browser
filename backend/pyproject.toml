[project]
name = "journal-browser-backend"
version = "0.1.0"
description = "Backend API for the Open Access Journal Browser"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "bibliofabric>=0.5",
    "aletheca>=0.2.2",
    "aireloom>=0.5.2",
    "stavrophora>=0.2.1",
    "httpx>=0.28.1",
    "alembic>=1.20.1",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.1",
    "fastembed>=0.9.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pyyaml>=6.0",
    "currencyconverter>=0.18.22",
    "nameparser>=2.8.0",
    "levenshtein>=0.27.5",
]


[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.1",
    "ty>=0.0.95",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/journal_browser"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits real network APIs (run explicitly: pytest -m live)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "jobs", "scripts"]
# Applied migrations are historical record; never reformat them.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RET", "RUF"]
# Intentional typography in strings and docstrings (en dashes, arrows,
# multiplication signs in harvest text) is not an obfuscation risk.
allowed-confusables = ["–", "—", "×", "→"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends() default pattern is idiomatic.
"src/journal_browser/main.py" = ["B008"]

[tool.ty.src]
include = ["src", "jobs", "tests", "scripts"]

[tool.ty.rules]
# Alpha-ty false positives on SQLAlchemy/FastAPI/pydantic idioms (ORM Row
# coercion, Mapped descriptors, JSONB looseness, constr() in annotations).
# Structural rules (unresolved-import, call-non-callable, invalid-raise,
# call-non-callable) stay at error; revisit these as ty matures.
invalid-argument-type = "warn"
unresolved-attribute = "warn"
invalid-assignment = "warn"
unsupported-operator = "warn"
invalid-return-type = "warn"
not-subscriptable = "warn"
invalid-type-form = "warn"
