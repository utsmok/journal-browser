[project]
name = "journal-browser-backend"
version = "0.1.0"
description = "Backend API for the Open Access Journal Browser"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "bibliofabric>=0.6,<0.7",
    "aletheca>=0.4,<0.5",
    "aireloom>=0.8,<0.9",
    "stavrophora>=0.3,<0.4",
    "httpx>=0.28.1",
    "alembic>=1.20.1",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.1",
    "fastembed>=0.9.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pyyaml>=6.0",
    "currencyconverter>=0.18.22",
    "nameparser>=2.8.0,<3",
    "levenshtein>=0.27.5",
    "pydantic>=2.14.1",
    "maxminddb>=3.3.0",
]


[dependency-groups]
dev = [
    "import-linter>=2.17",
    "pytest>=8.3",
    # <1.5: 1.5.0's auto-mode fixture binding runs async fixtures on a
    # pytest-asyncio loop while anyio-marked tests run on anyio's own loop,
    # so asyncpg futures cross event loops (tests/test_meta.py).
    "pytest-asyncio>=0.24,<1.6",
    "ruff>=0.17.1",
    "ty>=0.0.107",
]

# Unreleased 0.6 family: resolved from the monorepo's overhaul branch until
# the PyPI release; replace with plain version pins afterwards.
[tool.uv.sources]
bibliofabric = { git = "https://github.com/utsmok/bibliofabric", branch = "overhaul-2026-11", subdirectory = "packages/bibliofabric" }
aireloom = { git = "https://github.com/utsmok/bibliofabric", branch = "overhaul-2026-11", subdirectory = "packages/aireloom" }
aletheca = { git = "https://github.com/utsmok/bibliofabric", branch = "overhaul-2026-11", subdirectory = "packages/aletheca" }
stavrophora = { git = "https://github.com/utsmok/bibliofabric", branch = "overhaul-2026-11", subdirectory = "packages/stavrophora" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/journal_browser"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: hits real network APIs (run explicitly: pytest -m live)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "jobs", "scripts"]
# Applied migrations are historical record; never reformat them.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RET", "RUF"]
# Intentional typography in strings and docstrings (en dashes, arrows,
# multiplication signs in harvest text) is not an obfuscation risk.
allowed-confusables = ["–", "—", "×", "→"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends() default pattern is idiomatic.
"src/journal_browser/main.py" = ["B008"]

[tool.ty.src]
include = ["src", "jobs", "tests", "scripts"]

[tool.ty.rules]
# Alpha-ty false positives on SQLAlchemy/FastAPI/pydantic idioms (ORM Row
# coercion, Mapped descriptors, JSONB looseness, constr() in annotations).
# Structural rules (unresolved-import, call-non-callable, invalid-raise,
# call-non-callable) stay at error; revisit these as ty matures.
invalid-argument-type = "warn"
missing-attribute = "warn"
invalid-assignment = "warn"
unsupported-operator = "warn"
invalid-explicit-return = "warn"
not-subscriptable = "warn"
invalid-type-form = "warn"

# `uv run lint-imports` (CI + pre-commit). harvest writes data and services
# read it; shared helpers live below both (identifiers, queries, topics).
[tool.importlinter]
root_packages = ["journal_browser"]

[[tool.importlinter.contracts]]
name = "harvest and services do not import each other"
type = "independence"
modules = ["journal_browser.harvest", "journal_browser.services"]

[[tool.importlinter.contracts]]
name = "shared helpers stay below harvest, services and routers"
type = "forbidden"
source_modules = [
    "journal_browser.config",
    "journal_browser.currency",
    "journal_browser.identifiers",
    "journal_browser.models",
    "journal_browser.queries",
    "journal_browser.topics",
    "journal_browser.vocab",
]
forbidden_modules = [
    "journal_browser.harvest",
    "journal_browser.routers",
    "journal_browser.services",
]

[[tool.importlinter.contracts]]
name = "sibling modules import each other in one direction only"
type = "acyclic_siblings"
ancestors = ["journal_browser", "journal_browser.**"]

[tool.deptry]
known_first_party = ["journal_browser"]

[tool.deptry.package_module_name_map]
pyyaml = ["yaml"]
currencyconverter = ["currency_converter"]
beautifulsoup4 = ["bs4"]
levenshtein = ["Levenshtein"]

[tool.deptry.per_rule_ignores]
# uvicorn is the server process, never imported; lxml is the bs4 parser
# selected by string name. numpy/starlette arrive with fastembed/fastapi but
# are imported directly -- promote them to direct dependencies if this
# baseline ever grows instead of extending these ignores.
DEP002 = ["uvicorn", "lxml"]
DEP001 = ["starlette", "numpy"]
