[project]
name = "journal-browser-backend"
version = "0.1.0"
description = "Backend API for the Open Access Journal Browser"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "bibliofabric>=0.5",
    "aletheca>=0.2.2",
    "aireloom>=0.5.2",
    "stavrophora>=0.2.1",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "loguru>=0.7.3",
    "alembic>=1.20.1",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/journal_browser"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits real network APIs (run explicitly: pytest -m live)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "jobs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends() default pattern is idiomatic.
"src/journal_browser/main.py" = ["B008"]
