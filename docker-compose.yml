services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: journal
      POSTGRES_DB: journalbrowser
    ports:
      - "5433:5432" # host 5433: machines often run a local postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal -d journalbrowser"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      JB_DATABASE_URL: postgresql+asyncpg://journal:journal@db:5432/journalbrowser
    volumes:
      # Raw landing copies and job logs must survive container rebuilds.
      - ./backend/landing:/app/landing
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
