# Shared env for backend and scheduler (same code image). Everything
# .env.example documents flows through here, so a new institute only edits
# .env and re-runs docker compose up.
x-backend-env: &backend-env
  JB_DATABASE_URL: postgresql+asyncpg://journal:journal@db:5432/journalbrowser
  # Canonical publications from a ut-metadata Postgres (read-only).
  # Empty/unset = feature off; wrong/unreachable DSN degrades the same
  # way at runtime. Inside compose, localhost is the container — point
  # this at a container-reachable address (e.g. host.docker.internal:5434).
  JB_UT_METADATA_DSN: ${JB_UT_METADATA_DSN:-}
  # Deployment levers (see .env.example); defaults fit a Twente instance.
  JB_INSTITUTION_NAME: ${JB_INSTITUTION_NAME:-University of Twente}
  JB_INSTITUTION_SHORT: ${JB_INSTITUTION_SHORT:-Twente}
  JB_INSTITUTION_ROR: ${JB_INSTITUTION_ROR:-https://ror.org/006hf6230}
  JB_LIBRARY_URL: ${JB_LIBRARY_URL:-https://www.utwente.nl/library}
  JB_OA_GUIDE_URL: ${JB_OA_GUIDE_URL:-https://www.utwente.nl/en/service-portal/university-library/publication-archiving/open-access}
  JB_SUPPORT_EMAIL: ${JB_SUPPORT_EMAIL:-open-access@utwente.nl}
  JB_ADMIN_CONTACT: ${JB_ADMIN_CONTACT:-}
  JB_RESEARCH_PORTAL_URL: ${JB_RESEARCH_PORTAL_URL:-https://research.utwente.nl}
  JB_PURE_OAI_BASE_URL: ${JB_PURE_OAI_BASE_URL:-https://ris.utwente.nl/ws/oai}
  JB_OPENAIRE_ORG_ID: ${JB_OPENAIRE_ORG_ID:-}
  JB_CONTACT_EMAIL: ${JB_CONTACT_EMAIL:-}
  JB_DATA_WINDOW_START: ${JB_DATA_WINDOW_START:-2020}
  JB_DATA_WINDOW_END: ${JB_DATA_WINDOW_END:-0}
  JB_ENABLE_JOURNAL_CITATIONS: ${JB_ENABLE_JOURNAL_CITATIONS:-false}
  JB_JISC_API_KEY: ${JB_JISC_API_KEY:-}
  JB_ADMIN_PASSWORD: ${JB_ADMIN_PASSWORD:-}
  OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
  # Usage tracking and the ISSN ignore list (README documents both).
  JB_ENABLE_USAGE_TRACKING: ${JB_ENABLE_USAGE_TRACKING:-}
  JB_USAGE_RETENTION_DAYS: ${JB_USAGE_RETENTION_DAYS:-}
  JB_IGNORED_ISSNS: ${JB_IGNORED_ISSNS:-}
  # API limits, statement timeout and OpenAlex budget floor (DEPLOYMENT.md,
  # Operations). Empty means the default: config.Settings ignores empty
  # variables.
  JB_RATE_LIMIT_PER_MINUTE: ${JB_RATE_LIMIT_PER_MINUTE:-}
  JB_RATE_LIMIT_HEAVY_PER_MINUTE: ${JB_RATE_LIMIT_HEAVY_PER_MINUTE:-}
  JB_RATE_LIMIT_FEEDBACK_PER_MINUTE: ${JB_RATE_LIMIT_FEEDBACK_PER_MINUTE:-}
  JB_STATEMENT_TIMEOUT_MS: ${JB_STATEMENT_TIMEOUT_MS:-}
  JB_OPENALEX_RESERVE_USD: ${JB_OPENALEX_RESERVE_USD:-}
  JB_WORK_FUNDERS_TTL_DAYS: ${JB_WORK_FUNDERS_TTL_DAYS:-}
  # "json" for one JSON object per log line; any other value is text.
  JB_LOG_FORMAT: ${JB_LOG_FORMAT:-}
  # Admin-editable settings overlay, seeded by the entrypoint on first
  # boot (see backend/settings.yaml.example and DEPLOYMENT.md).
  JB_SETTINGS_YAML: /app/state/settings.yaml
  # Scheduler schedules, UTC (see backend/scripts/crontab).
  JB_SOURCE_WAVE_CRON: ${JB_SOURCE_WAVE_CRON:-0 22 * * 0}
  JB_REFRESH_WAVE_CRON: ${JB_REFRESH_WAVE_CRON:-30 1 * * *}
  JB_BACKUP_CRON: ${JB_BACKUP_CRON:-0 4 * * *}
  JB_BACKUP_KEEP: ${JB_BACKUP_KEEP:-7}
  # Job alerts and heartbeat (backend/scripts/lib.sh): a failed wave or
  # backup POSTs to the webhook, and each job that ends well pings the URL.
  # JB_ALERT_HOST names this deployment in the alerts (default: the
  # container hostname).
  JB_ALERT_WEBHOOK_URL: ${JB_ALERT_WEBHOOK_URL:-}
  JB_ALERT_HOST: ${JB_ALERT_HOST:-}
  JB_HEARTBEAT_URL: ${JB_HEARTBEAT_URL:-}
  TZ: ${TZ:-UTC}
  JB_DOCS_DIR: /app/docs

# Unbounded container logs grow the host disk fast (harvest JSON on stdout);
# keep five 50 MB files per service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    # postgres:17-alpine + pgvector (see db/Dockerfile). Same PG major as
    # before, so the pgdata volume carries over unchanged.
    build: ./db
    restart: unless-stopped
    # Headroom for HNSW builds and large sorts; the page cache counts too.
    mem_limit: 4g
    logging: *default-logging
    environment:
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: journal
      POSTGRES_DB: journalbrowser
    # HNSW index builds (pgvector) need shared memory beyond the 64 MB
    # container default; the graph for ~134k vectors peaks around 100 MB.
    shm_size: 512mb
    # Tuned for the 4 GB limit on SSD-backed storage: the HNSW index (~350 MB)
    # and hot journal rows fit in shared_buffers; JIT only adds planning
    # time to this workload's short queries.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
      # Query statistics for finding slow statements (DEPLOYMENT.md, "Query
      # statistics"). track=top times whole statements, not the statements
      # nested in functions. Needs a db restart to take effect.
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
    ports:
      - "127.0.0.1:5433:5432" # host 5433: machines often run a local postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal -d journalbrowser"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    # One image serves backend, scheduler, and bootstrap: build lives here,
    # the other two reference the same tag, so a single `docker compose
    # build backend` updates all three.
    image: journal-browser-backend:latest
    build: ./backend
    restart: unless-stopped
    mem_limit: 2g
    logging: *default-logging
    environment: *backend-env
    volumes:
      # Raw landing copies and job logs must survive container rebuilds.
      - ./backend/landing:/app/landing
      # Admin-editable settings overlay (see backend/settings.yaml.example).
      - ./backend/state:/app/state
      # Markdown docs served via /api/v1/docs (read-only; edits live in DB).
      - ./docs:/app/docs:ro
      # Backup listing for the admin ops card (GET /admin/ops/status).
      - ./backups:/backups:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # /api/v1/healthz executes SELECT 1 against the DB. Plain curl, which
      # the image ships (backend/Dockerfile): `uv run` started a Python
      # interpreter every 30 s for that one request.
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://127.0.0.1:8000/api/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

  # Nightly harvest wave + database backup via supercronic
  # (backend/scripts/crontab). Runs the same image as the backend; the
  # wave script self-skips its credit-priced stages at a spent OpenAlex
  # budget, so an unexpected daytime start is safe. Schedules are UTC and
  # overridable via JB_SOURCE_WAVE_CRON / JB_REFRESH_WAVE_CRON /
  # JB_BACKUP_CRON in .env.
  scheduler:
    image: journal-browser-backend:latest
    restart: unless-stopped
    mem_limit: 2g
    logging: *default-logging
    environment: *backend-env
    volumes:
      - ./backend/landing:/app/landing
      - ./backend/state:/app/state
      # Nightly pg_dump archives (see backend/scripts/backup.sh).
      - ./backups:/backups
    command: ["/bin/sh", "/app/scripts/run_scheduler.sh"]
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

  # One-shot initial harvest on a fresh database (jobs/bootstrap.py). Auto
  # mode exits in seconds once journals exist, so every `up` re-runs it
  # harmlessly; a failure keeps the backend down where the logs point at it.
  bootstrap:
    image: journal-browser-backend:latest
    restart: "no"
    mem_limit: 2g
    logging: *default-logging
    # Root only for the entrypoint's chown: docker creates the bind-mounted
    # dirs root-owned on fresh hosts; docker-entrypoint.sh hands them to
    # uid 1000 and drops privileges, so even `compose run` one-offs never
    # write root-owned files into the host mounts.
    user: root
    environment:
      JB_DATABASE_URL: postgresql+asyncpg://journal:journal@db:5432/journalbrowser
      # Author ingest (jobs/ingest_authors.py) reads the same read-only
      # ut-metadata DSN the backend serves from; unset keeps the job skipping.
      JB_UT_METADATA_DSN: ${JB_UT_METADATA_DSN:-}
      JB_INSTITUTION_NAME: ${JB_INSTITUTION_NAME:-University of Twente}
      JB_INSTITUTION_SHORT: ${JB_INSTITUTION_SHORT:-Twente}
      JB_INSTITUTION_ROR: ${JB_INSTITUTION_ROR:-https://ror.org/006hf6230}
      JB_LIBRARY_URL: ${JB_LIBRARY_URL:-https://www.utwente.nl/library}
      JB_OA_GUIDE_URL: ${JB_OA_GUIDE_URL:-https://www.utwente.nl/en/service-portal/university-library/publication-archiving/open-access}
      JB_SUPPORT_EMAIL: ${JB_SUPPORT_EMAIL:-open-access@utwente.nl}
      JB_ADMIN_CONTACT: ${JB_ADMIN_CONTACT:-}
      JB_RESEARCH_PORTAL_URL: ${JB_RESEARCH_PORTAL_URL:-https://research.utwente.nl}
      JB_PURE_OAI_BASE_URL: ${JB_PURE_OAI_BASE_URL:-https://ris.utwente.nl/ws/oai}
      JB_OPENAIRE_ORG_ID: ${JB_OPENAIRE_ORG_ID:-}
      JB_CONTACT_EMAIL: ${JB_CONTACT_EMAIL:-}
      JB_DATA_WINDOW_START: ${JB_DATA_WINDOW_START:-2020}
      JB_DATA_WINDOW_END: ${JB_DATA_WINDOW_END:-0}
      JB_BOOTSTRAP: ${JB_BOOTSTRAP:-auto}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      # The first boot's credit-priced stages stop at the same reserve.
      JB_OPENALEX_RESERVE_USD: ${JB_OPENALEX_RESERVE_USD:-}
    volumes:
      - ./backend/landing:/app/landing
      - ./backend/state:/app/state
      - ./backups:/backups
    command: >
      sh -c "uv run --no-dev alembic upgrade head &&
             uv run --no-dev python jobs/bootstrap.py"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://journalbrowser.samuelmok.cc}
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    environment:
      API_PROXY_URL: http://backend:8000
      # Same institution env as the backend: the root layout seeds the
      # server render from these, so the first paint names the right
      # institute even before /meta hydrates.
      JB_INSTITUTION_NAME: ${JB_INSTITUTION_NAME:-University of Twente}
      JB_INSTITUTION_SHORT: ${JB_INSTITUTION_SHORT:-Twente}
      JB_LIBRARY_URL: ${JB_LIBRARY_URL:-https://www.utwente.nl/library}
      JB_OA_GUIDE_URL: ${JB_OA_GUIDE_URL:-https://www.utwente.nl/en/service-portal/university-library/publication-archiving/open-access}
      JB_SUPPORT_EMAIL: ${JB_SUPPORT_EMAIL:-open-access@utwente.nl}
      JB_ADMIN_CONTACT: ${JB_ADMIN_CONTACT:-}
      JB_RESEARCH_PORTAL_URL: ${JB_RESEARCH_PORTAL_URL:-https://research.utwente.nl}
    ports:
      # 0.0.0.0 on purpose: the frontend is the public surface, published
      # through the host's reverse proxy; db/backend stay loopback-only.
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
