services:
  db:
    # postgres:17-alpine + pgvector (see db/Dockerfile). Same PG major as
    # before, so the pgdata volume carries over unchanged.
    build: ./db
    restart: unless-stopped
    environment:
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: journal
      POSTGRES_DB: journalbrowser
    # HNSW index builds (pgvector) need shared memory beyond the 64 MB
    # container default; the graph for ~134k vectors peaks around 100 MB.
    shm_size: 512mb
    ports:
      - "127.0.0.1:5433:5432" # host 5433: machines often run a local postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal -d journalbrowser"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      JB_DATABASE_URL: postgresql+asyncpg://journal:journal@db:5432/journalbrowser
      # Canonical publications from a ut-metadata Postgres (read-only).
      # Empty/unset = feature off; wrong/unreachable DSN degrades the same
      # way at runtime. Inside compose, localhost is the container — point
      # this at a container-reachable address (e.g. host.docker.internal:5434).
      JB_UT_METADATA_DSN: ${JB_UT_METADATA_DSN:-}
      # Deployment levers (see .env.example); defaults fit a Twente instance.
      # Everything .env.example documents flows through here, so a new
      # institute only edits .env and re-runs docker compose up.
      JB_INSTITUTION_NAME: ${JB_INSTITUTION_NAME:-University of Twente}
      JB_INSTITUTION_SHORT: ${JB_INSTITUTION_SHORT:-Twente}
      JB_INSTITUTION_ROR: ${JB_INSTITUTION_ROR:-https://ror.org/006hf6230}
      JB_LIBRARY_URL: ${JB_LIBRARY_URL:-https://www.utwente.nl/library}
      JB_OA_GUIDE_URL: ${JB_OA_GUIDE_URL:-https://www.utwente.nl/en/service-portal/university-library/publication-archiving/open-access}
      JB_SUPPORT_EMAIL: ${JB_SUPPORT_EMAIL:-open-access@utwente.nl}
      JB_ADMIN_CONTACT: ${JB_ADMIN_CONTACT:-s.mok@utwente.nl}
      JB_RESEARCH_PORTAL_URL: ${JB_RESEARCH_PORTAL_URL:-https://research.utwente.nl}
      JB_PURE_OAI_BASE_URL: ${JB_PURE_OAI_BASE_URL:-https://ris.utwente.nl/ws/oai}
      JB_OPENAIRE_ORG_ID: ${JB_OPENAIRE_ORG_ID:-}
      JB_CONTACT_EMAIL: ${JB_CONTACT_EMAIL:-}
      JB_DATA_WINDOW_START: ${JB_DATA_WINDOW_START:-2020}
      JB_DATA_WINDOW_END: ${JB_DATA_WINDOW_END:-0}
      JB_ENABLE_JOURNAL_CITATIONS: ${JB_ENABLE_JOURNAL_CITATIONS:-false}
      JB_ENABLE_JISC: ${JB_ENABLE_JISC:-false}
      JB_JISC_API_KEY: ${JB_JISC_API_KEY:-}
      JB_ADMIN_PASSWORD: ${JB_ADMIN_PASSWORD:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    volumes:
      # Raw landing copies and job logs must survive container rebuilds.
      - ./backend/landing:/app/landing
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # /api/v1/healthz executes SELECT 1 against the DB.
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-dev",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

  # One-shot initial harvest on a fresh database (jobs/bootstrap.py). Auto
  # mode exits in seconds once journals exist, so every `up` re-runs it
  # harmlessly; a failure keeps the backend down where the logs point at it.
  bootstrap:
    build: ./backend
    restart: "no"
    # Root only for the entrypoint's chown: docker creates the bind-mounted
    # landing dir root-owned on fresh hosts; docker-entrypoint.sh hands it to
    # uid 1000 and drops privileges, so even `compose run` one-offs never
    # write root-owned files into the host mount.
    user: root
    environment:
      JB_DATABASE_URL: postgresql+asyncpg://journal:journal@db:5432/journalbrowser
      JB_INSTITUTION_NAME: ${JB_INSTITUTION_NAME:-University of Twente}
      JB_INSTITUTION_SHORT: ${JB_INSTITUTION_SHORT:-Twente}
      JB_INSTITUTION_ROR: ${JB_INSTITUTION_ROR:-https://ror.org/006hf6230}
      JB_LIBRARY_URL: ${JB_LIBRARY_URL:-https://www.utwente.nl/library}
      JB_OA_GUIDE_URL: ${JB_OA_GUIDE_URL:-https://www.utwente.nl/en/service-portal/university-library/publication-archiving/open-access}
      JB_SUPPORT_EMAIL: ${JB_SUPPORT_EMAIL:-open-access@utwente.nl}
      JB_ADMIN_CONTACT: ${JB_ADMIN_CONTACT:-s.mok@utwente.nl}
      JB_RESEARCH_PORTAL_URL: ${JB_RESEARCH_PORTAL_URL:-https://research.utwente.nl}
      JB_PURE_OAI_BASE_URL: ${JB_PURE_OAI_BASE_URL:-https://ris.utwente.nl/ws/oai}
      JB_OPENAIRE_ORG_ID: ${JB_OPENAIRE_ORG_ID:-}
      JB_CONTACT_EMAIL: ${JB_CONTACT_EMAIL:-}
      JB_DATA_WINDOW_START: ${JB_DATA_WINDOW_START:-2020}
      JB_DATA_WINDOW_END: ${JB_DATA_WINDOW_END:-0}
      JB_BOOTSTRAP: ${JB_BOOTSTRAP:-auto}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    volumes:
      - ./backend/landing:/app/landing
    command: >
      sh -c "uv run --no-dev alembic upgrade head &&
             uv run --no-dev python jobs/bootstrap.py"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://journalbrowser.samuelmok.cc}
    restart: unless-stopped
    environment:
      API_PROXY_URL: http://backend:8000
      # Same institution env as the backend: the root layout seeds the
      # server render from these, so the first paint names the right
      # institute even before /meta hydrates.
      JB_INSTITUTION_NAME: ${JB_INSTITUTION_NAME:-University of Twente}
      JB_INSTITUTION_SHORT: ${JB_INSTITUTION_SHORT:-Twente}
      JB_LIBRARY_URL: ${JB_LIBRARY_URL:-https://www.utwente.nl/library}
      JB_OA_GUIDE_URL: ${JB_OA_GUIDE_URL:-https://www.utwente.nl/en/service-portal/university-library/publication-archiving/open-access}
      JB_SUPPORT_EMAIL: ${JB_SUPPORT_EMAIL:-open-access@utwente.nl}
      JB_ADMIN_CONTACT: ${JB_ADMIN_CONTACT:-s.mok@utwente.nl}
      JB_RESEARCH_PORTAL_URL: ${JB_RESEARCH_PORTAL_URL:-https://research.utwente.nl}
    ports:
      # 0.0.0.0 on purpose: the frontend is the public surface, published
      # through the host's reverse proxy; db/backend stay loopback-only.
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
