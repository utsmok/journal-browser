# University of Groningen test stack (RUG): own ports, own landing dir,
# project-scoped volume via -p jb-groningen. Proves the fresh-deployment
# story for a second Dutch university.
#
#   export OPENALEX_API_KEY=...
#   docker compose -p jb-groningen -f docker-compose.yml -f compose.groningen.yml up -d --build
#
# !override replaces the base lists (ports/volumes merge by appending).
services:
  db:
    ports: !override
      - "127.0.0.1:5543:5432"

  bootstrap:
    volumes: !override
      - ./backend/landing-groningen:/app/landing
    environment:
      JB_DATABASE_URL: postgresql+asyncpg://journal:journal@db:5432/journalbrowser
      JB_INSTITUTION_NAME: University of Groningen
      JB_INSTITUTION_SHORT: Groningen
      JB_INSTITUTION_ROR: https://ror.org/012p63287
      JB_LIBRARY_URL: https://www.rug.nl/library
      JB_OA_GUIDE_URL: https://www.rug.nl/library/open-access/
      JB_SUPPORT_EMAIL: openaccess@rug.nl
      JB_ADMIN_CONTACT: ""
      JB_RESEARCH_PORTAL_URL: https://research.rug.nl
      JB_PURE_OAI_BASE_URL: https://pure.rug.nl/ws/oai
      JB_OPENAIRE_ORG_ID: openorgs____::81371ea94b1a09d3243e73d6ec3527ec
      JB_DATA_WINDOW_START: "2025"
      JB_DATA_WINDOW_END: "2025"
      JB_UT_METADATA_DSN: ""
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}

  backend:
    ports: !override
      - "127.0.0.1:8002:8000"
    volumes: !override
      - ./backend/landing-groningen:/app/landing
    environment:
      JB_DATABASE_URL: postgresql+asyncpg://journal:journal@db:5432/journalbrowser
      JB_INSTITUTION_NAME: University of Groningen
      JB_INSTITUTION_SHORT: Groningen
      JB_INSTITUTION_ROR: https://ror.org/012p63287
      JB_LIBRARY_URL: https://www.rug.nl/library
      JB_OA_GUIDE_URL: https://www.rug.nl/library/open-access/
      JB_SUPPORT_EMAIL: openaccess@rug.nl
      JB_ADMIN_CONTACT: ""
      JB_RESEARCH_PORTAL_URL: https://research.rug.nl
      JB_UT_METADATA_DSN: ""
      JB_DATA_WINDOW_START: "2025"
      JB_DATA_WINDOW_END: "2025"


  frontend:
    environment:
      # Same RUG values the backend serves; seeds the SSR fallback.
      JB_INSTITUTION_NAME: University of Groningen
      JB_INSTITUTION_SHORT: Groningen
      JB_LIBRARY_URL: https://www.rug.nl/library
      JB_OA_GUIDE_URL: https://www.rug.nl/library/open-access/
      JB_SUPPORT_EMAIL: openaccess@rug.nl
      JB_ADMIN_CONTACT: ""
      JB_RESEARCH_PORTAL_URL: https://research.rug.nl
    ports: !override
      - "3002:3000"
